name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m py_compile lact_mcp.py && python3 lact_mcp.py --version
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: lact_mcp.py
