name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m py_compile lact_mcp.py && python3 lact_mcp.py --version
      - name: Pick release body (per-tag notes, CHANGELOG fallback)
        run: |
          f="release-notes/${{ github.ref_name }}.md"
          [ -f "$f" ] || f=CHANGELOG.md
          cp "$f" release-body.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          files: lact_mcp.py
